<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ink</title>
    <meta
      name="description"
      content="A colour-naming game against a draining clock. Every answer you get right buys back time, and the payout keeps shrinking."
    />

    <!--
      The link-preview card: public/card.png, 1200x630. The URL resolves
      against this page, like any link. No og:title/og:description: scrapers
      fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The clock is the first thing on screen and the last thing you watch. -->
    <div class="clock" role="timer" aria-label="Time remaining">
      <div class="clock__fill" id="clock-fill"></div>
    </div>

    <header class="masthead">
      <nav aria-label="Primary">
        <a class="wordmark" href="./"><h1>Ink</h1></a>
      </nav>
      <p class="tally">
        <span class="tally__score" id="score">0</span>
      </p>
    </header>

    <main class="field" id="field">
      <div class="stage" id="stage">
        <p class="word" id="word" aria-live="polite" aria-atomic="true"></p>
      </div>
      <div class="swatches" id="swatches" role="group" aria-label="Colours"></div>
    </main>

    <aside class="records" id="records" hidden>
      <ol class="records__list" id="records-list"></ol>
    </aside>

    <div class="verdict" id="verdict" hidden>
      <p class="verdict__score" id="verdict-score">0</p>
      <button class="verdict__again" id="again" type="button" aria-label="Play again">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"
            fill="currentColor"
          />
        </svg>
      </button>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
